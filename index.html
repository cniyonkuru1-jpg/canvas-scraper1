<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Assignment Board</title>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="hero">
    <div class="wrap">
      <div class="hero-top">
        <div>
          <h1>Assignment board</h1>
          <p class="sub" id="source"></p>
        </div>
        <button class="load" id="loadBtn" type="button">Load scraped file</button>
        <input id="fileInput" type="file" accept=".json,application/json" hidden>
      </div>

      <section class="progress" aria-label="Progress summary">
        <div class="bar" id="bar" role="img"></div>
        <ul class="legend" id="legend"></ul>
      </section>
    </div>
  </header>

  <main class="wrap">
    <div class="filters" id="filters" role="group" aria-label="Filter assignments"></div>
    <ul class="list" id="list"></ul>
    <p class="note">Run <code>node scraper.js</code>, then load the <code>canvas_assignments.json</code> file it creates.</p>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
